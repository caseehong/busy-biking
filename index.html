<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <!-- Mapbox GL JS CSS -->
    <link
        href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
        rel="stylesheet"
    />
    <script src="map.js" type="module"></script>
  </head>
  <body>
    <header>
      <div>
        <h1>🚴🏼‍♀️ Busy Biking</h1>
        <p>An interactive map of Boston that visualizes bike traffic at different times of the day.</p>
      </div>
      <label class="time-filter" for="time-slider">
        Filter by time:
        <input id="time-slider" type="range" min="-1" max="1440" value="-1" step="1" />
        <span class="time-display">
          <time id="selected-time"></time>
          <em id="any-time">(any time)</em>
        </span>
      </label>
    </header>
    <div id="map">
      <svg></svg>
    </div>
  </body>
</html>
